
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#091525">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Germany Trip">

<title>Germany Trip 2026</title>

<style>
  :root {
    color-scheme: dark;

    --bg: #091525;
    --header: #0b2340;
    --panel: #13243b;
    --panel-hover: #192e49;
    --border: #294360;

    --text: #eaf3ff;
    --muted: #a7bfd5;

    --blue: #12a4ee;
    --orange: #ff911d;
    --gold: #ffb347;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(
        ellipse at 20% 0%,
        rgba(18, 104, 194, 0.13),
        transparent 45%
      ),
      var(--bg);
    color: var(--text);
  }

  /* HEADER */

  header {
    background: var(--header);
    color: var(--text);
    padding: 20px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 2px solid var(--orange);
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
  }

  header h1 {
    margin: 0 0 5px;
    font-size: 23px;
    color: #ffffff;
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* DATE NAVIGATION */

  nav {
    display: flex;
    overflow-x: auto;
    gap: 7px;
    padding-top: 16px;
    padding-bottom: 3px;
    scrollbar-width: none;
  }

  nav::-webkit-scrollbar {
    display: none;
  }

  nav a {
    padding: 9px 12px;
    border: 1px solid #345875;
    background: #163554;
    border-radius: 20px;
    color: #eaf3ff;
    text-decoration: none;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
  }

  nav a:hover {
    background: #20527e;
    border-color: var(--orange);
  }

  nav a:focus-visible {
    outline: 2px solid var(--orange);
    outline-offset: 3px;
  }

  /* ITINERARY */

  main {
    padding: 16px 12px 35px;
    max-width: 680px;
    margin: auto;
  }

  article {
    background: linear-gradient(
      145deg,
      #162b45,
      var(--panel)
    );
    color: var(--text);
    border: 1px solid var(--border);
    padding: 19px;
    margin-bottom: 15px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.22);
    scroll-margin-top: 145px;
  }

  .date {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 7px;
    color: var(--gold);
  }

  .route {
    font-size: 14px;
    line-height: 1.5;
    color: #c2d8ee;
  }

  .route strong {
    color: #ffffff;
    font-size: 16px;
  }

  .driving {
    font-size: 12px;
    color: var(--muted);
    margin-top: 9px;
  }

  .activities {
    font-size: 14px;
    line-height: 1.6;
    color: #e0ebf7;
    margin: 14px 0;
  }

  /* HOTEL */

  .hotel {
    padding: 15px 0;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .hotel > div {
    min-width: 0;
  }

  .hotel strong {
    display: block;
    font-size: 14px;
    color: #ffffff;
  }

  .hotel small {
    display: block;
    color: var(--muted);
    margin-top: 5px;
    font-size: 12px;
    line-height: 1.4;
  }

  /* GOOGLE MAPS BUTTONS */

  .go {
    display: inline-block;
    background: #087eae;
    color: #ffffff;
    border: 1px solid #249ed1;
    border-radius: 10px;
    padding: 12px 17px;
    text-decoration: none;
    font-weight: 800;
    font-size: 13px;
    min-width: 56px;
    text-align: center;
    white-space: nowrap;
    transition: background .15s, transform .15s;
  }

  .go:hover {
    background: #109bcf;
    transform: translateY(-1px);
  }

  .go:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 3px;
  }

  .go.full {
    display: block;
    margin: 12px 0;
    background: linear-gradient(
      120deg,
      #b75c0c,
      #e18416
    );
    border-color: var(--orange);
    color: #ffffff;
    padding: 15px;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(255,145,29,.12);
  }

  .go.full:hover {
    background: #ef931d;
  }

  /* SIGHTSEEING STOPS */

  details {
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 13px;
  }

  summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    padding: 4px 0;
  }

  summary:hover {
    color: #ffd18a;
  }

  .stop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    font-size: 13px;
    color: var(--text);
  }

  .stop:last-child {
    border-bottom: none;
  }

  /* TRAIN INFORMATION */

  .train {
    background: #193b4e;
    border: 1px solid #28788a;
    border-left: 4px solid var(--blue);
    border-radius: 10px;
    padding: 14px;
    color: #e1f6ff;
    font-size: 13px;
    line-height: 1.6;
    margin: 13px 0;
  }

  .train strong {
    color: #ffffff;
  }

  /* FOOTER */

  footer {
    padding: 16px 5px;
    color: #95adc5;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
  }

  /* MOBILE */

  @media(max-width: 520px) {
    header {
      padding: 17px 13px 13px;
    }

    header h1 {
      font-size: 21px;
    }

    main {
      padding: 12px 10px 30px;
    }

    article {
      padding: 16px;
      border-radius: 13px;
      margin-bottom: 12px;
    }

    .date {
      font-size: 18px;
    }

    .hotel {
      gap: 10px;
    }

    .hotel strong {
      font-size: 13px;
    }

    .hotel small {
      font-size: 11px;
    }

    .stop {
      font-size: 12px;
    }

    .go {
      padding: 11px 13px;
      min-width: 54px;
    }
  }

  @media(prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    .go {
      transition: none;
    }
  }
</style>
</head>

<body>

<header>
  <h1>🎄 Germany Trip 2026</h1>
  <p>December 21–31 · Family Christmas Road Trip</p>
  <nav id="navigation"></nav>
</header>

<main id="itinerary"></main>

<script>

const hotels = {

  },
  prague: {

    address: "Na Moráni 15, Prague, Czechia"
  },
  augsburg: {
    name: "Holiday Inn Express Augsburg",
    address: "Nagahama-Allee 77, Augsburg, Germany"
  },
  fussen: {
    name: "Best Western Plus Hotel Füssen",
    address: "Augsburger Straße 18, Füssen, Germany"
  },
  telfs: {
    name: "Harry's Home Telfs",
    address: "Weißenbachgasse 21, Telfs, Austria"
  },
  freiburg: {

  },
  airport: {

    address: "Am Söldnermoos 2, Hallbergmoos, Germany"
  }
};

// Google Maps destination lookup

function map(place) {
  return "https://www.google.com/maps/search/?api=1&query="
    + encodeURIComponent(place);
}

// Google Maps driving route with intermediate stops

function drive(stops) {
  const origin = stops[0];
  const destination = stops[stops.length - 1];
  const waypoints = stops.slice(1, -1);

  let url = "https://www.google.com/maps/dir/?api=1"
    + "&origin=" + encodeURIComponent(origin)
    + "&destination=" + encodeURIComponent(destination)
    + "&travelmode=driving";

  if (waypoints.length) {
    url += "&waypoints=" +
      waypoints.map(encodeURIComponent).join("%7C");
  }

  return url;
}

const days = [

  },

      "Arrive 12:05 PM. Pick up SIXT rental SUV. Explore the Christmas market at Marienplatz.",
    hotel: "munich",

        "Marienplatz, Munich, Germany"

      "Morning self-guided visit to Dachau Memorial (allow 3–4 hours). Continue to Nuremberg for the Christkindlesmarkt and dinner at Bratwursthäusle.",
    hotel: "nuremberg",
    stops: [
      [
        "Dachau Memorial",

      ]
    ]
  },

  {
    date: "Dec 24",
    day: "Thursday",
    title: "Prague",
    from: "Nuremberg",
    to: "Prague",
    driving: "300 km / 186 mi · 3¼–4 hours",
    activities:
      "Drive to Prague, check into Best Western Hotel Moran, then explore the historic Old Town on Christmas Eve.",
    hotel: "prague",
    stops: [
      [
        "Prague Old Town Square",
        "Old Town Square, Prague, Czechia"
      ]
    ]
  },

  {
    date: "Dec 25",
    day: "Friday",
    title: "Christmas Day in Prague",
    from: "Prague",
    to: "Prague",
    activities:
      "Christmas markets at Old Town Square and Wenceslas Square. Optional Charles Bridge sightseeing.",
    hotel: "prague",
    stops: [
      [
        "Old Town Square",
        "Old Town Square, Prague, Czechia"
      ],
      [
        "Wenceslas Square",
        "Wenceslas Square, Prague, Czechia"
      ],
      [
        "Charles Bridge",

      ]
    ]
  },

  {
    date: "Dec 26",

    title: "Rothenburg and Augsburg",
    from: "Prague",
    to: "Augsburg",
    activities:
      "Drive via Rothenburg ob der Tauber. Explore the medieval Old Town, then continue to your Augsburg hotel.",
    hotel: "augsburg",
    driving:
      "Long driving day · allow extra time for Rothenburg",
    drivingRoute: [
      hotels.prague.address,
      "Rothenburg ob der Tauber, Germany",
      hotels.augsburg.address
    ],
    stops: [

      ]
    ]
  },

  {

    hotel: "fussen",
    driving:

    stops: [
      [
        "Dinkelsbühl",

      ],
      [

      ],
      [

      ]
    ]
  },

  {

    hotel: "freiburg",

      hotels.telfs.address,
      "Lucerne, Switzerland",

      hotels.freiburg.address
    ],
    stops: [
      [

      ],

      ]
    ]
  },

  {
    date: "Dec 30",

    title: "Black Forest to Munich",
    from: "Freiburg",
    to: "Munich Airport area",
    activities:
      "Scenic Black Forest drive with stops at Titisee and Triberg. Continue to your final overnight hotel in Hallbergmoos.",
    hotel: "airport",
    driving:
      "Scenic detour · allow most of the day",
    drivingRoute: [
      hotels.freiburg.address,
      "Titisee-Neustadt, Germany",
      "Triberg im Schwarzwald, Germany",
      hotels.airport.address
    ],
    stops: [
      [
        "Titisee Lake",
        "Titisee, Titisee-Neustadt, Germany"
      ],
      [

        "Triberg im Schwarzwald, Germany"
      ]
    ]
  },

  {
    date: "Dec 31",
    day: "Thursday",
    title: "Return Home",
    from: "Munich",
    to: "Nashville",
    activities:
      "Drive to Munich Airport and return the SIXT SUV. Flight departs MUC at 1:00 PM. Arrive BNA at 6:45 PM.",
    stops: [
      [
        "SIXT Rental Return",
        "SIXT Car Return, Munich Airport P6, Germany"
      ],
      [
        "Munich Airport",
        "Munich Airport, Germany"
      ]
    ]
  }

];

// Create Google Maps buttons

function goButton(label, url, full = false) {
  return `<a class="go ${full ? "full" : ""}"
    href="${url}"
    target="_blank"
    rel="noopener noreferrer">
    ${label}
  </a>`;
}

// Render itinerary

function render() {

  document.getElementById("navigation").innerHTML =
    days.map((d, i) =>
      `<a href="#day${i}">${d.date}</a>`
    ).join("");

  document.getElementById("itinerary").innerHTML =
    days.map((d, i) => {

      let content = `
        <article id="day${i}">
          <div class="date">
            ${d.date} · ${d.day}
          </div>

          <div class="route">
            <strong>${d.title}</strong>
          </div>

          <div class="route">
            ${d.from} → ${d.to}
          </div>

          ${d.driving
            ? `<div class="driving">🚗 ${d.driving}</div>`
            : ""}

          <p class="activities">
            ${d.activities}
          </p>
      `;

      // Train information

      if (d.train) {
        content += `
          <div class="train">
            🚆 <strong>Train excursion</strong>
            <br>
            ${d.train}
          </div>
        `;
      }

      // Scenic driving route

      if (d.drivingRoute) {
        content += goButton(
          d.date === "Dec 28"
            ? "🚗 GO · Drive to Innsbruck Station"
            : "🚗 GO · Full Scenic Driving Route",
          drive(d.drivingRoute),
          true
        );
      }

      // Hotel information

      if (d.hotel) {
        const hotel = hotels[d.hotel];

        content += `
          <div class="hotel">
            <div>
              <strong>🏨 ${hotel.name}</strong>
              <small>${hotel.address}</small>
            </div>

            ${goButton("GO", map(hotel.address))}
          </div>
        `;
      }

      // Sightseeing navigation

      if (d.stops && d.stops.length) {

        content += `
          <details>
            <summary>
              📍 Sightseeing Stops & Navigation
            </summary>
        `;

        d.stops.forEach(stop => {

          content += `
            <div class="stop">
              <span>${stop[0]}</span>
              ${goButton("GO", map(stop[1]))}
            </div>
          `;
        });

        content += `</details>`;
      }

      content += `</article>`;

      return content;

    }).join("");

  document.getElementById("itinerary").innerHTML += `
    <footer>
      Driving times are estimates.
      Check winter road conditions,
      attraction hours, and your train ticket.
      Google Maps GO buttons require an internet connection.
    </footer>
  `;
}

render();

</script>
</body>
</html>
